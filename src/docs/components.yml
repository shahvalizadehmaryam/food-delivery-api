components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        phone:
          type: string
          example: "4155552671"
        name:
          type: string
          nullable: true
          example: John Doe
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
        isBlocked:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Token:
      type: object
      description: JWT object returned by the API after a successful login.
      properties:
        token:
          type: string
          description: Full JWT string. Copy this only from the **Response body** after clicking Execute on verify-otp.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzUzMDAxODAwLCJ0eXBlIjoiQUNDRVNTIn0.dGV2LWV4YW1wbGUtdG9rZW4
        expires:
          type: string
          format: date-time
          example: "2026-07-20T08:12:36.126Z"

    AuthTokens:
      type: object
      description: Use `refresh.token` for logout, not `access.token`.
      properties:
        access:
          $ref: "#/components/schemas/Token"
        refresh:
          $ref: "#/components/schemas/Token"

    SendOtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          pattern: '^[2-9]\d{9}$'
          example: "4155552671"
          description: US phone number (10 digits)

    VerifyOtpRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          pattern: '^[2-9]\d{9}$'
          example: "4155552671"
        code:
          type: string
          minLength: 5
          maxLength: 5
          example: "12345"

    SendOtpResponse:
      type: object
      properties:
        message:
          type: string
          example: OTP sent successfully

    VerifyOtpLoginResponse:
      type: object
      properties:
        isRegistered:
          type: boolean
          example: true
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/AuthTokens"
      example:
        isRegistered: true
        user:
          id: 1
          phone: "4155552671"
          name: John Doe
          role: USER
          isBlocked: false
          createdAt: "2026-07-20T07:42:36.126Z"
          updatedAt: "2026-07-20T07:42:36.126Z"
        tokens:
          access:
            token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzUzMDAxODAwLCJ0eXBlIjoiQUNDRVNTIn0.dGV2LWV4YW1wbGUtdG9rZW4
            expires: "2026-07-20T08:12:36.126Z"
          refresh:
            token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzU1NTkyMDAwLCJ0eXBlIjoiUkVGUkVTSCJ9.dGV2LWV4YW1wbGUtdG9rZW4
            expires: "2026-08-19T07:42:36.126Z"

    VerifyOtpRegisterResponse:
      type: object
      properties:
        isRegistered:
          type: boolean
          example: false
        phone:
          type: string
          example: "4155552671"
        message:
          type: string
          example: Phone verified. Please complete registration.

    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Paste `tokens.refresh.token` from the verify-otp **Response body** after Execute. Leave empty until you have a real token.

    UpdateMyProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: John Doe
          description: Display name for the user
      minProperties: 1

    UpdateUserByIdRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Jane Smith
          description: Display name for the user
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
          description: User role
        isBlocked:
          type: boolean
          example: false
          description: Whether the user account is blocked
      minProperties: 1

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

    # --- Menu schemas (mirror src/types/menu.ts) ---

    MenuItemSize:
      type: object
      description: One size option for a menu item (Small, Medium, Large).
      required:
        - id
        - label
        - price
      properties:
        id:
          type: string
          example: small
          description: Unique size id within the item (e.g. small, medium, large)
        label:
          type: string
          example: Small
          description: Display label shown in the UI
        price:
          type: number
          format: float
          example: 7.19
          description: Base price in dollars before discount
        discountType:
          type: string
          enum:
            - percentage
            - fixed
          example: percentage
          description: How the discount is applied (optional)
        discountValue:
          type: number
          format: float
          example: 5
          description: Discount amount — percentage (5 = 5%) or fixed dollars (4 = $4 off)

    MenuItem:
      type: object
      description: A single food item card in the menu grid.
      required:
        - id
        - title
        - description
        - image
        - sizes
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Royal Cheese Burger with extra Fries
        description:
          type: string
          example: 1 McChicken™, 1 Big Mac™, 1 Royal Cheese Burger and 1 Royal Cheese Bacon Burger, 4 Medium Fries and 4 drinks of your choice
        image:
          type: string
          format: uri
          example: https://example.com/images/burger-royal.jpg
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/MenuItemSize"

    MenuSection:
      type: object
      description: A menu category section (e.g. Burgers, Fries).
      required:
        - id
        - title
        - items
      properties:
        id:
          type: string
          example: burgers
          description: URL-friendly section id
        title:
          type: string
          example: Burgers
          description: Section heading shown in the UI
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 400
            message: Invalid OTP code.
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  
