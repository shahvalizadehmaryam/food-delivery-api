components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        phone:
          type: string
          example: "4155552671"
        name:
          type: string
          nullable: true
          example: Mary-Jane
          description: First name
        lastname:
          type: string
          nullable: true
          example: O'Brien
          description: Last name
        state:
          type: string
          nullable: true
          example: CA
          description: US state code
        city:
          type: string
          nullable: true
          example: Los Angeles
        address:
          type: string
          nullable: true
          example: 123 Main Street
        dob:
          type: string
          format: date
          nullable: true
          example: "2000-01-15"
          description: Date of birth (YYYY-MM-DD)
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
        isBlocked:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Token:
      type: object
      description: JWT object returned by the API after a successful login.
      properties:
        token:
          type: string
          description: Full JWT string. Copy this only from the **Response body** after clicking Execute on verify-otp.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzUzMDAxODAwLCJ0eXBlIjoiQUNDRVNTIn0.dGV2LWV4YW1wbGUtdG9rZW4
        expires:
          type: string
          format: date-time
          example: "2026-07-20T08:12:36.126Z"

    AuthTokens:
      type: object
      description: Use `refresh.token` for logout, not `access.token`.
      properties:
        access:
          $ref: "#/components/schemas/Token"
        refresh:
          $ref: "#/components/schemas/Token"

    SendOtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          pattern: '^[2-9]\d{9}$'
          example: "4155552671"
          description: US phone number (10 digits)

    VerifyOtpRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          pattern: '^[2-9]\d{9}$'
          example: "4155552671"
        code:
          type: string
          minLength: 5
          maxLength: 5
          example: "12345"

    SendOtpResponse:
      type: object
      properties:
        message:
          type: string
          example: OTP sent successfully

    VerifyOtpLoginResponse:
      type: object
      properties:
        isRegistered:
          type: boolean
          example: true
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/AuthTokens"
      example:
        isRegistered: true
        user:
          id: 1
          phone: "4155552671"
          name: Mary-Jane
          lastname: O'Brien
          state: CA
          city: Los Angeles
          address: 123 Main Street
          dob: "2000-01-15"
          role: USER
          isBlocked: false
          createdAt: "2026-07-20T07:42:36.126Z"
          updatedAt: "2026-07-20T07:42:36.126Z"
        tokens:
          access:
            token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzUzMDAxODAwLCJ0eXBlIjoiQUNDRVNTIn0.dGV2LWV4YW1wbGUtdG9rZW4
            expires: "2026-07-20T08:12:36.126Z"
          refresh:
            token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzU1NTkyMDAwLCJ0eXBlIjoiUkVGUkVTSCJ9.dGV2LWV4YW1wbGUtdG9rZW4
            expires: "2026-08-19T07:42:36.126Z"

    VerifyOtpRegisterResponse:
      type: object
      properties:
        isRegistered:
          type: boolean
          example: false
        phone:
          type: string
          example: "4155552671"
        message:
          type: string
          example: Phone verified. Please complete registration.

    # Request body for POST /auth/register
    RegisterRequest:
      type: object
      required:
        - phone
        - code
        - name
        - lastname
        - state
        - city
        - address
        - dob
      properties:
        phone:
          type: string
          pattern: '^[2-9]\d{9}$'
          example: "4155552671"
          description: Same US phone used in send-otp / verify-otp (10 digits)
        code:
          type: string
          minLength: 5
          maxLength: 5
          example: "12345"
          description: 5-digit OTP from send-otp (must still be valid)
        name:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[A-Za-z][A-Za-z\s''-]{1,49}$'
          example: Mary-Jane
          description: |
            First name. Trimmed. Letters only (spaces, apostrophes, hyphens allowed).
            Must start with a letter.
        lastname:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[A-Za-z][A-Za-z\s''-]{1,49}$'
          example: O'Brien
          description: Last name. Same rules as `name`.
        state:
          type: string
          enum:
            - AL
            - AK
            - AZ
            - AR
            - CA
            - CO
            - CT
            - DE
            - DC
            - FL
            - GA
            - HI
            - ID
            - IL
            - IN
            - IA
            - KS
            - KY
            - LA
            - ME
            - MD
            - MA
            - MI
            - MN
            - MS
            - MO
            - MT
            - NE
            - NV
            - NH
            - NJ
            - NM
            - NY
            - NC
            - ND
            - OH
            - OK
            - OR
            - PA
            - RI
            - SC
            - SD
            - TN
            - TX
            - UT
            - VT
            - VA
            - WA
            - WV
            - WI
            - WY
          example: CA
          description: US state / district code (50 states + DC)
        city:
          type: string
          minLength: 1
          example: Los Angeles
          description: City name. Must be a valid city for the selected `state`.
        address:
          type: string
          minLength: 5
          maxLength: 120
          example: 123 Main Street
          description: Street address (trimmed, 5–120 characters)
        dob:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2000-01-15"
          description: |
            Date of birth as YYYY-MM-DD.
            Must not be in the future. User must be at least 13 years old.

    # Success response for POST /auth/register
    RegisterResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/AuthTokens"

    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Paste `tokens.refresh.token` from the verify-otp **Response body** after Execute. Leave empty until you have a real token.

    RefreshTokensRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Paste `tokens.refresh.token` from the verify-otp **Response body** after Execute.

    UpdateMyProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: John Doe
          description: Display name for the user
      minProperties: 1

    UpdateUserByIdRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Jane Smith
          description: Display name for the user
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
          description: User role
        isBlocked:
          type: boolean
          example: false
          description: Whether the user account is blocked
      minProperties: 1

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

    # --- Menu schemas (mirror src/types/menu.ts) ---

    MenuItemSize:
      type: object
      description: One size option for a menu item (Small, Medium, Large).
      required:
        - id
        - label
        - price
      properties:
        id:
          type: string
          example: small
          description: Unique size id within the item (e.g. small, medium, large)
        label:
          type: string
          example: Small
          description: Display label shown in the UI
        price:
          type: number
          format: float
          example: 7.19
          description: Base price in dollars before discount
        discountType:
          type: string
          enum:
            - percentage
            - fixed
          example: percentage
          description: How the discount is applied (optional)
        discountValue:
          type: number
          format: float
          example: 5
          description: Discount amount — percentage (5 = 5%) or fixed dollars (4 = $4 off)
        finalPrice:
          type: number
          format: float
          example: 6.83
          description: Price after discount (static or flash). Omitted when there is no discount.
        flashDeal:
          type: object
          description: Present only while a flash deal is active for this size
          properties:
            id:
              type: integer
              example: 1
            endsAt:
              type: string
              format: date-time
              example: "2026-08-02T14:00:00.000Z"

    FlashDeal:
      type: object
      description: Time-limited discount for a menu item (optionally one size).
      properties:
        id:
          type: integer
          example: 1
        menuItemId:
          type: integer
          example: 3
        sizeId:
          type: string
          nullable: true
          example: medium
          description: null = all sizes on the item
        discountType:
          type: string
          enum:
            - percentage
            - fixed
          example: percentage
        discountValue:
          type: number
          format: float
          example: 25
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        menuItem:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
            image:
              type: string

    CreateFlashDealRequest:
      type: object
      required:
        - menuItemId
        - discountType
        - discountValue
      description: |
        Provide **either** `durationHours` **or** `endsAt` (not both).
        `startsAt` defaults to now if omitted.
      properties:
        menuItemId:
          type: integer
          example: 1
        sizeId:
          type: string
          nullable: true
          enum:
            - small
            - medium
            - large
          example: medium
        discountType:
          type: string
          enum:
            - percentage
            - fixed
          example: percentage
        discountValue:
          type: number
          example: 25
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        durationHours:
          type: number
          example: 4
          description: Convenience — sets endsAt = startsAt + N hours

    UpdateFlashDealRequest:
      type: object
      properties:
        sizeId:
          type: string
          nullable: true
          enum:
            - small
            - medium
            - large
        discountType:
          type: string
          enum:
            - percentage
            - fixed
        discountValue:
          type: number
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        isActive:
          type: boolean
          description: Set false to end a deal early

    MenuItem:
      type: object
      description: A single food item card in the menu grid.
      required:
        - id
        - title
        - description
        - image
        - sizes
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Royal Cheese Burger with extra Fries
        description:
          type: string
          example: 1 McChicken™, 1 Big Mac™, 1 Royal Cheese Burger and 1 Royal Cheese Bacon Burger, 4 Medium Fries and 4 drinks of your choice
        image:
          type: string
          format: uri
          example: https://example.com/images/burger-royal.jpg
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/MenuItemSize"

    MenuSection:
      type: object
      description: A menu category section (e.g. Burgers, Fries).
      required:
        - id
        - title
        - items
      properties:
        id:
          type: string
          example: burgers
          description: URL-friendly section id
        title:
          type: string
          example: Burgers
          description: Section heading shown in the UI
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"

    BasketItem:
      type: object
      description: |
        One line in the basket — matches the frontend cart item shape.
        `price` is the final (discounted) price; `originalPrice` is the base size price.
      required:
        - id
        - basketId
        - productId
        - title
        - sizeLabel
        - price
        - originalPrice
        - quantity
      properties:
        id:
          type: integer
          example: 17
          description: BasketItem database id — use this in PATCH/DELETE /items/{itemId}
        basketId:
          type: string
          example: basket-1730000000000-abc12
        productId:
          type: integer
          example: 42
          description: MenuItem.id
        title:
          type: string
          example: Margherita Pizza
        sizeLabel:
          type: string
          example: Large
          description: Display label (from MenuItemSize.label)
        price:
          type: number
          format: float
          example: 12.99
          description: Final price after discount (snapshot at add time)
        originalPrice:
          type: number
          format: float
          example: 14.99
          description: Base size price before discount
        discountType:
          type: string
          enum:
            - percentage
            - fixed
          example: percentage
        discountValue:
          type: number
          format: float
          example: 13
        quantity:
          type: integer
          minimum: 1
          example: 1
        customizations:
          nullable: true
          description: Not modeled yet — omitted or null/undefined

    Basket:
      type: object
      required:
        - basketId
        - items
      properties:
        basketId:
          type: string
          example: basket-1730000000000-abc12
        items:
          type: array
          items:
            $ref: "#/components/schemas/BasketItem"

    AddBasketItemRequest:
      type: object
      required:
        - productId
        - sizeId
      properties:
        productId:
          type: integer
          example: 42
        sizeId:
          type: string
          example: large
          description: MenuItemSize.id (e.g. small, medium, large)
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1

    UpdateBasketItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 3

    MergeBasketRequest:
      type: object
      required:
        - guestBasketId
      properties:
        guestBasketId:
          type: string
          example: basket-1730000000000-abc12
          description: Guest basket id from localStorage

    OrderItem:
      type: object
      description: Snapshot of a basket line at checkout. Prices do not change if the menu is updated later.
      required:
        - productId
        - title
        - sizeId
        - sizeLabel
        - price
        - originalPrice
        - quantity
      properties:
        productId:
          type: integer
          example: 42
          description: MenuItem.id at checkout time
        title:
          type: string
          example: Margherita Pizza
        sizeId:
          type: string
          example: large
        sizeLabel:
          type: string
          example: Large
        price:
          type: number
          format: float
          example: 12.99
          description: Final unit price after discount
        originalPrice:
          type: number
          format: float
          example: 14.99
          description: Base size price before discount
        quantity:
          type: integer
          minimum: 1
          example: 2

    Order:
      type: object
      required:
        - id
        - status
        - items
        - subtotal
        - deliveryAddress
        - isValidOrder
        - paymentStatus
        - placedAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 1
        status:
          type: string
          enum:
            - PENDING_PAYMENT
            - PLACED
            - PREPARING
            - OUT_FOR_DELIVERY
            - DELIVERED
            - CANCELED
          example: PLACED
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: number
          format: float
          example: 25.98
        deliveryAddress:
          type: string
          example: 123 Main Street, Los Angeles, CA
        note:
          type: string
          nullable: true
          example: No onions
        isValidOrder:
          type: boolean
          example: true
          description: Soft-delete flag. Canceled orders are set to false.
        paymentStatus:
          type: string
          enum:
            - UNPAID
            - PAID
            - FAILED
            - REFUNDED
          example: PAID
        stripeCheckoutSessionId:
          type: string
          nullable: true
          example: cs_test_a1b2c3
        paidAt:
          type: string
          format: date-time
          nullable: true
        placedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlaceOrderRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          nullable: true
          example: No onions
        deliveryAddress:
          type: string
          minLength: 5
          maxLength: 500
          example: 123 Main Street, Los Angeles, CA
          description: Optional. Falls back to the user's profile address.

    CheckoutSession:
      type: object
      required:
        - orderId
        - url
      properties:
        orderId:
          type: integer
          example: 12
        url:
          type: string
          format: uri
          example: https://checkout.stripe.com/c/pay/cs_test_a1b2c3

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PREPARING
            - OUT_FOR_DELIVERY
            - DELIVERED
            - CANCELED
          example: PREPARING

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 400
            message: Invalid OTP code.
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  
