paths:
  /auth/send-otp:
    post:
      summary: Send OTP to phone number
      description: Generates a 5-digit OTP and sends it to the provided phone number.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOtpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/verify-otp:
    post:
      summary: Verify OTP
      description: |
        Verifies the OTP code. If the phone belongs to an existing user, returns auth tokens.
        If the user is new, returns `isRegistered: false` so the client can redirect to registration.

        **Important:** After you click **Execute**, copy tokens from the **Response body** section below.
        Do **not** copy from the **Example Value** tab in the schema docs — those are placeholders and will not work.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerifyOtpLoginResponse"
                  - $ref: "#/components/schemas/VerifyOtpRegisterResponse"
              examples:
                existingUser:
                  summary: Existing user (login)
                  description: Real tokens appear here after you click Execute — copy from the live Response body, not this static sample.
                  value:
                    isRegistered: true
                    user:
                      id: 1
                      phone: "4155552671"
                      name: Mary-Jane
                      lastname: O'Brien
                      state: CA
                      city: Los Angeles
                      address: 123 Main Street
                      dob: "2000-01-15"
                      role: USER
                      isBlocked: false
                      createdAt: "2026-07-20T07:42:36.126Z"
                      updatedAt: "2026-07-20T07:42:36.126Z"
                    tokens:
                      access:
                        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzUzMDAxODAwLCJ0eXBlIjoiQUNDRVNTIn0.dGV2LWV4YW1wbGUtdG9rZW4
                        expires: "2026-07-20T08:12:36.126Z"
                      refresh:
                        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzU1NTkyMDAwLCJ0eXBlIjoiUkVGUkVTSCJ9.dGV2LWV4YW1wbGUtdG9rZW4
                        expires: "2026-08-19T07:42:36.126Z"
                newUser:
                  summary: New user (register next)
                  value:
                    isRegistered: false
                    phone: "4155552671"
                    message: Phone verified. Please complete registration.
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/register:
    post:
      summary: Register a new user
      description: |
        Completes registration for a **new** phone number after OTP was verified.

        **Flow:** `send-otp` → `verify-otp` (returns `isRegistered: false`) → `register`

        Use the same `phone` and `code` from the previous steps. The OTP is consumed on success
        and cannot be reused. On success, returns the new user and auth tokens.

        ### Field rules
        | Field | Rules |
        |-------|--------|
        | `name` / `lastname` | Trimmed, 2–50 chars. Letters only (spaces, apostrophes, hyphens allowed). Must start with a letter. |
        | `state` | Trimmed US state code (e.g. `CA`). Must be from the allowed list. |
        | `city` | Trimmed, required. Must be a valid city for the selected `state`. |
        | `address` | Trimmed, 5–120 characters. |
        | `dob` | `YYYY-MM-DD`. Not in the future. User must be at least 13 years old. |
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              phone: "4155552671"
              code: "12345"
              name: Mary-Jane
              lastname: O'Brien
              state: CA
              city: Los Angeles
              address: 123 Main Street
              dob: "2000-01-15"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                user:
                  id: 1
                  phone: "4155552671"
                  name: Mary-Jane
                  lastname: O'Brien
                  state: CA
                  city: Los Angeles
                  address: 123 Main Street
                  dob: "2000-01-15"
                  role: USER
                  isBlocked: false
                  createdAt: "2026-07-27T08:00:00.000Z"
                  updatedAt: "2026-07-27T08:00:00.000Z"
                tokens:
                  access:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzUzMDAxODAwLCJ0eXBlIjoiQUNDRVNTIn0.dGV2LWV4YW1wbGUtdG9rZW4
                    expires: "2026-07-27T08:30:00.000Z"
                  refresh:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc1MzAwMDAwMCwiZXhwIjoxNzU1NTkyMDAwLCJ0eXBlIjoiUkVGUkVTSCJ9.dGV2LWV4YW1wbGUtdG9rZW4
                    expires: "2026-08-26T08:00:00.000Z"
        "400":
          description: |
            Validation failed, invalid/expired OTP, or phone already registered.
            Common messages: invalid name, invalid state/city, dob too young, OTP expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  summary: Validation error
                  value:
                    code: 400
                    message: city must be a valid city for the selected state
                phoneExists:
                  summary: Phone already registered
                  value:
                    code: 400
                    message: An account with this phone already exists
                invalidOtp:
                  summary: Invalid or expired OTP
                  value:
                    code: 400
                    message: Invalid OTP code.

  /auth/logout:
    post:
      summary: Log out
      description: |
        Invalidates the refresh token so it cannot be used again.

        Use `tokens.refresh.token` from the **verify-otp Response body** (not the schema Example Value).
        The access token (`tokens.access.token`) cannot be used here.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Logged out successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh-tokens:
    post:
      summary: Refresh auth tokens
      description: |
        Exchanges a still-valid refresh token for a new access + refresh pair.
        The previous refresh token is deleted and cannot be reused.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokensRequest"
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

tags:
  - name: Auth
    description: Phone OTP authentication
