# Payment API paths — loaded by src/routes/v1/docs.route.ts
paths:
  /payments/checkout:
    post:
      summary: Start checkout from my basket (card or crypto)
      description: |
        Creates a `PENDING_PAYMENT` order from the authenticated user's basket
        and a payment page URL.

        Send `method` in the body:

        - `card` (default) → Stripe card checkout
        - `crypto` → CoinGate crypto invoice

        - Basket must not be empty
        - Amount is calculated on the server from basket prices
        - Basket is **not** cleared until CoinGate/Stripe confirms payment
          (webhook, or CoinGate API sync on `GET /orders/me/{orderId}`)
        - Previous unpaid checkout sessions for this user are expired
        - Redirect the browser to the returned `url`
      tags:
        - Payments
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            examples:
              crypto:
                summary: Pay with crypto (CoinGate)
                value:
                  note: No onions
                  deliveryAddress: 123 Main Street, Los Angeles, CA
                  method: crypto
              card:
                summary: Pay with card (Stripe)
                value:
                  note: No onions
                  deliveryAddress: 123 Main Street, Los Angeles, CA
                  method: card
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: Empty basket, missing address, or payment provider error
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Payment provider keys or redirect URLs are missing

  /payments/webhook:
    post:
      summary: Stripe webhook
      description: |
        Called by Stripe, not by the app.

        Verifies the Stripe signature, then:

        - `checkout.session.completed` → order becomes `PLACED` + `PAID`, basket is cleared
        - `checkout.session.expired` → order becomes `CANCELED` + `FAILED`

        This route must receive the raw JSON body.
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        "400":
          description: Missing or invalid Stripe signature

  /payments/coingate/webhook:
    post:
      summary: CoinGate payment callback
      description: |
        Called by CoinGate, not by the app. Do not send a user JWT.

        Verifies the per-order `token`, then:

        - `paid` → order becomes `PLACED` + `PAID`, basket is cleared
        - `expired` / `canceled` / `invalid` → order becomes `CANCELED` + `FAILED`
        - `new` / `pending` / `confirming` → ignored (payment not final)

        `COINGATE_CALLBACK_URL` must be a public URL. CoinGate cannot reach
        `localhost`. Use ngrok (or similar) in development:

        `https://xxxx.ngrok-free.app/v1/payments/coingate/webhook`

        If the webhook never arrives, the app still syncs status from the
        CoinGate API when the user fetches the order or calls
        `POST /payments/orders/{orderId}/sync`.
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              id: 123456
              order_id: "50"
              status: paid
              token: per-order-callback-token
      responses:
        "200":
          description: Callback received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        "400":
          description: Missing or invalid CoinGate token

  /payments/orders/{orderId}/sync:
    post:
      summary: Sync crypto payment status from CoinGate
      description: |
        Pulls the current invoice status from CoinGate and updates the order.

        Use this after the user returns from CoinGate (`COINGATE_SUCCESS_URL`).
        That URL only redirects the browser; it does not mark the order paid.

        `GET /orders/me/{orderId}` also syncs unpaid CoinGate orders, so polling
        that endpoint is enough for the success page.

        A missed webhook (for example `localhost` callback URL) does not leave
        the order stuck. Unpaid invoices that CoinGate already marked `paid`
        are updated here. Orders whose webhook never arrived at checkout time
        are also updated on the next sync.
      tags:
        - Payments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            example: 55
      responses:
        "200":
          description: Order after syncing with CoinGate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

tags:
  - name: Payments
    description: Card (Stripe) and crypto (CoinGate) checkout and payment webhooks
